name: Deploy to Yandex Cloud Object Storage

on:
  push:
    branches: [ master ] # Ваша основная ветка

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Configure AWS CLI for Yandex Cloud
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          pip install awscli
          # Устанавливаем endpoint Яндекса
          aws configure set default.s3.endpoint_url https://storage.yandexcloud.net
          # Используем 'virtual' для совместимости с новыми версиями CLI
          aws configure set s3.addressing_style virtual

      - name: Sync dist folder to Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
        run: |
          echo "Checking configuration..."
          
          if [ -z "$BUCKET_NAME" ]; then
            echo "::error::Variable BUCKET_NAME is empty! Please check GitHub Secrets -> YC_BUCKET_NAME"
            exit 1
          fi
          
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Variable AWS_ACCESS_KEY_ID is empty!"
            exit 1
          fi

          echo "Deploying to s3://${BUCKET_NAME}"
          
          # Синхронизация файлов
          aws s3 sync ./dist s3://${BUCKET_NAME} --delete
