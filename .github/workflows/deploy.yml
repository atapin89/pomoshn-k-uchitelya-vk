name: Deploy to Yandex Cloud Object Storage

on:
  push:
    branches: [ master ] # Ваша основная ветка

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS CLI for Yandex Cloud
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          pip install awscli
          # Устанавливаем endpoint Яндекса
          aws configure set default.s3.endpoint_url https://storage.yandexcloud.net
          # Важная настройка для совместимости с S3 API Яндекса
          aws configure set s3.addressing_style virtual-hosted

      - name: Sync dist folder to Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
        run: |
          echo "Deploying to s3://${BUCKET_NAME}"
          
          # Проверка, что секреты не пустые (для отладки)
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::YC_ACCESS_KEY_ID is missing in GitHub Secrets!"
            exit 1
          fi
          
          if [ -z "$BUCKET_NAME" ]; then
            echo "::error::YC_BUCKET_NAME is missing in GitHub Secrets!"
            exit 1
          fi

          # Синхронизируем папку dist с бакетом. 
          # --delete удаляет старые файлы из бакета, которых нет в новой сборке
          aws s3 sync ./dist s3://${BUCKET_NAME} --delete
